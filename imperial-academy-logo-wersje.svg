    <use href="#witch-hat" x="48" y="31"/>
    <path d="M220 170c8-13 25-13 33 0c-2 18-9 27-16 27s-15-9-17-27Z" fill="#F28C28" stroke="#9B4E12" stroke-width="2"/>
    <path d="M237 166v-8" fill="none" stroke="#427A38" stroke-width="4" stroke-linecap="round"/>
