      <path class="crown crown-blue" d="M14 25 11 12l12 8 9-13 9 13 12-8-3 13"/>
      <path class="book" d="M10 29c9-2 16 0 22 6 6-6 13-8 22-6v24c-9-2-16 0-22 5-6-5-13-7-22-5V29Z"/>
