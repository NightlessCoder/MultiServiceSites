  <!-- Sześć świątecznych odpowiedników -->
  <g transform="translate(0 560)"><use href="#version-1"/><use href="#santa-hat" x="48" y="34"/><text class="season-label" x="42" y="265" fill="#C62828">OPCJA ŚWIĄTECZNA · WERSJA 1</text></g>
  <g transform="translate(0 560)"><use href="#version-2"/><use href="#santa-hat" x="548" y="34"/><text class="season-label" x="542" y="265" fill="#C62828">OPCJA ŚWIĄTECZNA · WERSJA 2</text></g>
  <g transform="translate(0 560)"><use href="#version-3"/><use href="#santa-hat" x="1048" y="34"/><text class="season-label" x="1042" y="265" fill="#C62828">OPCJA ŚWIĄTECZNA · WERSJA 3</text></g>
  <g transform="translate(0 840)"><use href="#version-4" transform="translate(0 -280)"/><use href="#santa-hat" x="48" y="34"/><text class="season-label" x="42" y="265" fill="#C62828">OPCJA ŚWIĄTECZNA · WERSJA 4</text></g>
  <g transform="translate(0 840)"><use href="#version-5" transform="translate(0 -280)"/><use href="#santa-hat" x="548" y="34"/><text class="season-label" x="542" y="265" fill="#C62828">OPCJA ŚWIĄTECZNA · WERSJA 5</text></g>
  <g transform="translate(0 840)"><use href="#version-6" transform="translate(0 -280)"/><use href="#santa-hat" x="1048" y="34"/><text class="season-label" x="1042" y="265" fill="#C62828">OPCJA ŚWIĄTECZNA · WERSJA 6</text></g>

  <!-- Wersja halloweenowa -->
  <g transform="translate(0 1120)">
